# Launcher production bundle. The development docker-compose.yml remains unchanged.
services:
  redis:
    image: redis:7-alpine
    volumes: [redis_data:/data]
  migrate:
    build: {context: ., dockerfile: Dockerfile.api}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@youtube-db:5432/${POSTGRES_DB:-youtube_transcription}
    command: alembic upgrade head
  api:
    build: {context: ., dockerfile: Dockerfile.api}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@youtube-db:5432/${POSTGRES_DB:-youtube_transcription}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on: [redis, migrate]
  worker:
    build: {context: ., dockerfile: Dockerfile.worker}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@youtube-db:5432/${POSTGRES_DB:-youtube_transcription}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on: [redis, migrate]
    command: celery -A worker worker --loglevel=info -Q transcription,correction
    healthcheck:
      test: ["CMD", "python", "-c", "from worker import celery_app; p = celery_app.control.inspect(timeout=1).ping(); raise SystemExit(0 if p else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.launcher
      args:
        NEXT_PUBLIC_BASE_PATH: /youtube
        INTERNAL_API_URL: http://api:8000
    environment:
      INTERNAL_API_URL: http://api:8000
    depends_on: [api]
volumes:
  redis_data:
