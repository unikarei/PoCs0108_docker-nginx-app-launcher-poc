# Launcher production bundle. The development docker-compose.yml remains unchanged.
services:
  postgres:
    image: postgres:14
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-youtube_transcription}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes: [postgres_data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    volumes: [redis_data:/data]
  migrate:
    build: {context: ., dockerfile: Dockerfile.api}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-youtube_transcription}
    depends_on: [postgres]
    command: alembic upgrade head
  api:
    build: {context: ., dockerfile: Dockerfile.api}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-youtube_transcription}
      REDIS_URL: redis://redis:6379/0
    depends_on: [postgres, redis, migrate]
  worker:
    build: {context: ., dockerfile: Dockerfile.worker}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-youtube_transcription}
      REDIS_URL: redis://redis:6379/0
    depends_on: [postgres, redis, migrate]
  frontend:
    build: {context: ./frontend, dockerfile: Dockerfile.launcher}
    environment:
      INTERNAL_API_URL: http://api:8000
    depends_on: [api]
volumes:
  postgres_data:
  redis_data:
