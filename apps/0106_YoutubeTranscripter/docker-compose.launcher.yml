# Launcher production bundle. The development docker-compose.yml remains unchanged.
services:
  redis:
    image: redis:7-alpine
    volumes: [redis_data:/data]
  migrate:
    build: {context: ., dockerfile: Dockerfile.api}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@youtube-db:5432/${POSTGRES_DB:-youtube_transcription}
    command: alembic upgrade head
  api:
    build: {context: ., dockerfile: Dockerfile.api}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@youtube-db:5432/${POSTGRES_DB:-youtube_transcription}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on: [redis, migrate]
  worker:
    build: {context: ., dockerfile: Dockerfile.worker}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@youtube-db:5432/${POSTGRES_DB:-youtube_transcription}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on: [redis, migrate]
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.launcher
      args:
        NEXT_PUBLIC_BASE_PATH: /youtube
        INTERNAL_API_URL: http://api:8000
    environment:
      INTERNAL_API_URL: http://api:8000
    depends_on: [api]
volumes:
  redis_data:
