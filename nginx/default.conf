# Server block: accept incoming HTTP traffic on port 80.
server {
    listen 80;                                         # Listen on standard HTTP port.
    server_name _;                                     # Catch all hostnames.

    # Redirect block: move plain root access to the app namespace root.
    location = / {
        return 302 /test-function.local/;              # Temporary redirect to namespaced path.
    }

    # Redirect block: normalize namespace path to include trailing slash.
    location = /test-function.local {
        return 301 /test-function.local/;              # Permanent slash normalization redirect.
    }

    # Proxy block: forward namespace traffic to FastAPI container.
    location /test-function.local/ {
        proxy_pass http://app:8000/;                   # Strip prefix and send to app root.
        proxy_http_version 1.1;                        # Keep modern proxy protocol behavior.
        proxy_set_header Host $host;                   # Preserve original Host header.
        proxy_set_header X-Real-IP $remote_addr;       # Forward client source IP.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # Proxy chain header.
        proxy_set_header X-Forwarded-Proto $scheme;    # Preserve original protocol.
    }
}
