services:
  youtube-db:
    image: postgres:14
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-youtube_transcription}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - youtube-transcripter-db-data:/var/lib/postgresql/data
    networks:
      multiapp_net:
        aliases:
          - youtube-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-youtube_transcription}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  youtube-transcripter-db-data:
    name: youtube-transcripter-db-data

networks:
  multiapp_net:
    external: true
    name: youtube_transcripter_net
